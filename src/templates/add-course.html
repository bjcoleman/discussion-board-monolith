<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add Course</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>

  <body>
    <div class="page">
      <header class="page-header">
        <div>
          <p class="page-label">Courses</p>
          <h1>Add a course</h1>
          <p class="page-description">
            Add a course so students can create discussions for it.
          </p>
        </div>
      </header>

      <main>
        <section class="form-card">
          <div class="form-section">
            <h2>Course information</h2>

            <div class="form-grid">
              <div class="form-field">
                <label for="department">Department</label>
                <input
                  id="department"
                  name="department"
                  type="text"
                  placeholder="e.g. CSCI"
                />
              </div>

              <div class="form-field">
                <label for="course-number">Course number</label>
                <input
                  id="course-number"
                  name="course-number"
                  type="text"
                  placeholder="e.g. 390"
                />
              </div>
            </div>

            <div class="form-field">
              <label for="course-name">Course name</label>
              <input
                id="course-name"
                name="course-name"
                type="text"
                placeholder="e.g. Cloud Computing"
              />
            </div>
          </div>

          <div class="form-actions">
            <a href="/" class="btn btn-secondary">
              Cancel
            </a>
            <button id="create-course-btn" class="btn btn-primary" type="button">
              Create course
            </button>
          </div>
        </section>
      </main>
    </div>

    <script>
      document.getElementById('create-course-btn').addEventListener('click', async () => {
        const department = document.getElementById('department').value.trim();
        const courseNumber = document.getElementById('course-number').value.trim();
        const name = document.getElementById('course-name').value.trim();

        if (!department || !courseNumber || !name) {
          alert('Please fill out all fields.');
          return;
        }

        try {
          const response = await fetch('/courses', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ department, courseNumber, name })
          });

          if (response.ok) {
            window.location.href = '/';
          } else {
            const data = await response.json();
            alert(data.error?.message || 'Failed to create course');
          }
        } catch (err) {
          console.error('Fetch error:', err);
          alert('Network error or server unreachable');
        }
      });
    </script>
  </body>
</html>
