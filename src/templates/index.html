<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Classroom Discussions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="static/styles.css" />
  </head>

  <body>
    <div class="page">
      <header class="site-header">
        <div class="brand">
          <h1>Classroom Discussions</h1>
          <p class="brand-tag">
            Ask questions. Share answers. Discuss your classes.
          </p>
        </div>

        <div class="header-actions">
          <a href="/courses/add" class="btn btn-secondary">Add course</a>
          <a href="/discussions/add" class="btn btn-primary">Add discussion</a>
        </div>
      </header>

      <main>
        <div class="section-header">
          <h2>Discussions</h2>
          <span class="section-count" id="total-count"></span>
        </div>
      
        <!-- Empty container to be populated by loadDiscussions() JS -->
        <div id="discussions-container"></div>
      </main>
    </div>
    <script>
      async function loadDiscussions() {
  const res = await fetch('/discussions');
  if (!res.ok) return;
  const { groups } = await res.json();

  const container = document.getElementById('discussions-container');
  container.innerHTML = '';

  let totalDiscussions = 0;

  groups.forEach(group => {
    totalDiscussions += group.discussions.length;
    const courseGroupHtml = `
      <div class="course-group">
        <div class="course-heading">
          <h3>${group.course.department} ${group.course.courseNumber} · ${group.course.name}</h3>
        </div>
        <ul class="discussion-list">
          ${group.discussions.map(d => `
            <li class="discussion-row">
              <div class="discussion-main">
                <h4 class="discussion-title">${d.title}</h4>
                <p class="discussion-meta">${d.createdAt}</p>
              </div>
              <div class="discussion-side">
                <span class="post-count">${d.postCount} posts</span>
                <a href="/discussions/${d.id}/view" class="btn btn-primary">View discussion</a>
              </div>
            </li>
          `).join('')}
        </ul>
      </div>
    `;
    container.insertAdjacentHTML('beforeend', courseGroupHtml);
  });

  document.getElementById('total-count').textContent = `${totalDiscussions} discussions`;
}

loadDiscussions();
    </script>
  </body>
</html>
