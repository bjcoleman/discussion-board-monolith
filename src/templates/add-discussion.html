<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add Discussion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>

  <body>
    <div class="page">
      <header class="page-header">
        <div>
          <p class="page-label">Discussions</p>
          <h1>Start a discussion</h1>
          <p class="page-description">
            Ask a question or start a conversation for one of your classes.
          </p>
        </div>
      </header>

      <main>
        <section class="form-card">
          <div class="form-section">
            <h2>Discussion information</h2>

            <div class="form-field">
              <label for="course">Course</label>
              <select id="course" name="course">
                <option value="">Select a course</option>
                <option value="1">CSCI 390 · Cloud Computing</option>
                <option value="2">CSCI 294 · Machine Learning</option>
              </select>
            </div>

            <div class="form-field">
              <label for="title">Discussion title</label>
              <input
                id="title"
                name="title"
                type="text"
              />
            </div>

            <div class="form-field">
              <label for="prompt">Prompt</label>
              <textarea
                id="prompt"
                name="prompt"
                rows="7"
                placeholder="Write your question or start the discussion..."
              ></textarea>
            </div>
          </div>

          <div class="form-actions">
            <a href="/" class="btn btn-secondary">Cancel</a>
            <button class="btn btn-primary" type="button">
              Create discussion
            </button>
          </div>
        </section>
      </main>
    </div>
    <script>
      // 1. Populate courses dropdown from GET /courses
      async function loadCourses() {
        const res = await fetch('/courses');
        if (res.ok) {
          const data = await res.json();
          const select = document.getElementById('course');
          select.innerHTML = '<option value="">Select a course</option>';
          data.courses.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = `${c.department} ${c.courseNumber} · ${c.name}`;
            select.appendChild(opt);
          });
        }
      }
      loadCourses();
    
      // 2. Submit new discussion to POST /discussions
      document.querySelector('.btn-primary').addEventListener('click', async () => {
        const courseId = parseInt(document.getElementById('course').value, 10);
        const title = document.getElementById('title').value.trim();
        const prompt = document.getElementById('prompt').value.trim();
    
        const response = await fetch('/discussions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ courseId, title, prompt })
        });
    
        if (response.ok) {
          window.location.href = '/';
        } else {
          const data = await response.json();
          alert(data.error?.message || 'Failed to create discussion');
        }
      });
    </script>
  </body>
</html>
