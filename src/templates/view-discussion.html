<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>View Discussion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>

  <body>
    <div class="page">
      <header class="site-header">
        <div class="brand">
          <p class="page-label" id="course-label"></p>
          <h1 id="discussion-title">Loading...</h1>
          <p class="discussion-meta" id="discussion-created"></p>
        </div>
      </header>
    
      <main>
        <section class="discussion-prompt">
          <h2>Prompt</h2>
          <p id="discussion-prompt-text"></p>
        </section>
    
        <div class="section-header">
          <h2>Replies</h2>
          <span class="section-count" id="reply-count">0 replies</span>
        </div>
    
        <!-- Empty list to be populated by loadDiscussion() JS -->
        <ul class="discussion-list" id="posts-list"></ul>
    
        <div class="reply-action">
          <button class="btn btn-primary" type="button" id="reply-btn">
            Reply to discussion
          </button>
        </div>
      </main>
    </div>
    <script>
      // Extract discussion_id from URL path (/discussions/<discussion_id>/view)
      const pathParts = window.location.pathname.split('/');
      const discussionId = pathParts[2];

      // Fetch discussion details and replies from GET /discussions/<discussion_id>
      async function loadDiscussion() {
        const res = await fetch(`/discussions/${discussionId}`);
        if (!res.ok) {
          document.getElementById('discussion-title').textContent = 'Discussion not found';
          return;
        }
        const d = await res.json();

        document.getElementById('course-label').textContent = 
          `${d.course.department} ${d.course.courseNumber} · ${d.course.name}`;
        document.getElementById('discussion-title').textContent = d.title;
        document.getElementById('discussion-created').textContent = `Started ${d.createdAt || ''}`;
        document.getElementById('discussion-prompt-text').textContent = d.prompt;
        document.getElementById('reply-count').textContent = `${d.posts.length} replies`;

        const list = document.getElementById('posts-list');
        list.innerHTML = d.posts.map(p => `
          <li class="discussion-row discussion-post">
            <div class="discussion-meta">
              <strong>${p.authorName}</strong>
              <span>${p.createdAt || ''}</span>
            </div>
            <div class="discussion-main">
              <p>${p.body}</p>
            </div>
          </li>
        `).join('');
      }

      // Submit new reply to POST /discussions/<discussion_id>/posts
      document.getElementById('reply-btn').addEventListener('click', async () => {
        const authorName = prompt("Your Name:");
        if (!authorName) return;

        const body = prompt("Your Reply:");
        if (!body) return;

        const res = await fetch(`/discussions/${discussionId}/posts`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ authorName, body })
        });

        if (res.ok) {
          loadDiscussion(); // Reload discussion list dynamically
        } else {
          const err = await res.json();
          alert(err.error?.message || 'Failed to submit reply');
        }
      });

      loadDiscussion();
    </script>
  </body>
</html>
